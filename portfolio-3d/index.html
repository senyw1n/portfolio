  <!-- Экран загрузки: виден, пока скачивается и запускается 3D-сцена -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      background: #101113; color: #e8e9e4; font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
      transition: opacity .5s ease, visibility .5s;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .box { width: min(340px, 80vw); }
    #boot .name { font: 800 28px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.03em; margin-bottom: 18px; }
    #boot .name b { color: #5ab8ff; }
    #boot .row { display: flex; justify-content: space-between; font-size: 12px; color: #8b9098; margin-bottom: 8px; }
    #boot .bar { height: 4px; background: #2b2f35; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0; background: #5ab8ff; transition: width .25s ease; }
    #boot .grid {
      position: absolute; inset: 0; z-index: -1; opacity: .5;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body style="background:#101113">
  <div id="boot" role="status" aria-live="polite">
    <div class="grid"></div>
    <div class="box">
      <div class="name">Sayat <b>Zhaksybay</b></div>
      <div class="row"><span id="boot-text">Рендер сцены…</span><span id="boot-pct">0%</span></div>
      <div class="bar"><i id="boot-bar"></i></div>
    </div>
  </div>
  <script>
    // Прогресс «рендера»: плавно растёт до 90%, а когда 3D-сцена готова — 100% и экран исчезает
    (function () {
      // Тот же выбор языка, что и в src/i18n.js
      var lang
      try { lang = localStorage.getItem('lang') } catch (e) {}
      if (lang !== 'ru' && lang !== 'en')
        lang = /(^|,)(ru|kk|be|uk)/i.test((navigator.languages || [navigator.language || 'ru']).join(',')) ? 'ru' : 'en'
      document.getElementById('boot-text').textContent = lang === 'en' ? 'Rendering scene…' : 'Рендер сцены…'
      var p = 0, pct = document.getElementById('boot-pct'), bar = document.getElementById('boot-bar')
      function set(v) { p = v; pct.textContent = Math.round(v) + '%'; bar.style.width = v + '%' }
      var timer = setInterval(function () { if (p < 90) set(p + (90 - p) * 0.08 + 0.3) }, 120)
      window.__bootDone = function () {
        clearInterval(timer); set(100)
        setTimeout(function () { document.getElementById('boot').classList.add('done') }, 250)
      }
    })()
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
